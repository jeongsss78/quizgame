<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선생님 대시보드 | 단원 정리 퀴즈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="../shared/glass.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="page">
    <header class="glass topbar">
      <div>
        <h1>선생님 대시보드</h1>
        <p class="muted">단원 정리 퀴즈</p>
      </div>
      <button id="logout-btn" class="btn" type="button">로그아웃</button>
    </header>

    <p id="msg" role="alert" aria-live="assertive" class="page-msg"></p>

    <!-- 홈: 방 만들기, 방 기록 -->
    <section id="view-home" class="stack">
      <div class="glass stack">
        <h2>새 게임 만들기</h2>
        <div class="row">
          <label for="duration">게임 시간</label>
          <select id="duration" class="input select">
            <option value="5">5분</option>
            <option value="10" selected>10분</option>
            <option value="15">15분</option>
            <option value="20">20분</option>
          </select>
          <button id="create-btn" class="btn btn-primary btn-lg" type="button">방 만들기</button>
        </div>
      </div>

      <div class="glass">
        <div class="row space">
          <h2>방 기록</h2>
          <button id="delete-all-btn" class="btn btn-danger" type="button">전체 기록 삭제</button>
        </div>
        <ul id="room-list" class="rec-list"></ul>
      </div>
    </section>

    <!-- 대기실: QR, 참가자, 시작 -->
    <section id="view-lobby" class="grid-2 hidden">
      <div class="glass qr-panel stack">
        <h2>학생 입장</h2>
        <div class="qr-box"><canvas id="qr" aria-label="입장 QR 코드"></canvas></div>
        <p id="room-code" class="code-big"></p>
        <p class="muted">QR을 찍거나 6자리 코드를 입력하세요.</p>
      </div>

      <div class="glass stack">
        <h2>참가자 <span id="player-count"></span></h2>
        <ul id="player-list" class="plain-list"></ul>
        <button id="start-btn" class="btn btn-primary btn-lg btn-block" type="button">게임 시작</button>
        <button id="lobby-back" class="btn btn-block" type="button">홈으로</button>
      </div>
    </section>

    <!-- 진행: 타이머, 제출 현황 -->
    <section id="view-play" class="stack hidden">
      <div class="glass play-head">
        <div>
          <p id="phase-label" class="muted">남은 시간</p>
          <p id="timer" class="timer">--:--</p>
        </div>
        <div>
          <p class="muted">전체 제출</p>
          <p id="progress-text" class="big-num">0 / 0</p>
        </div>
        <button id="end-btn" class="btn btn-danger" type="button">게임 종료</button>
      </div>

      <div class="glass">
        <div class="progress" role="progressbar" aria-label="전체 제출 진행률">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <table class="table">
          <thead><tr><th>별명</th><th class="num">제출 수</th></tr></thead>
          <tbody id="progress-body"></tbody>
        </table>
      </div>
    </section>

    <!-- 결과: 시상, 전체 순위, 공개 -->
    <section id="view-result" class="stack hidden">
      <div class="glass stack">
        <div class="row space">
          <h2>결과</h2>
          <div class="row">
            <button id="reveal-btn" class="btn btn-primary" type="button">학생에게 순위 공개</button>
            <button id="result-home" class="btn" type="button">홈으로</button>
          </div>
        </div>
        <p id="reveal-state" class="muted"></p>
        <div id="podium" class="podium"></div>
        <table class="table">
          <thead>
            <tr>
              <th class="num">순위</th>
              <th>별명</th>
              <th class="num">점수</th>
              <th class="num">맞힌 개수</th>
            </tr>
          </thead>
          <tbody id="rank-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
  <script src="../shared/config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
