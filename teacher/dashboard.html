<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선생님 대시보드 - 단원 정리 퀴즈</title>
  <link rel="stylesheet" href="../shared/glass.css" />
</head>
<body>
  <div class="container">
    <header class="glass-panel header">
      <div>
        <h1>선생님 대시보드</h1>
        <p class="subtitle">단원 정리 퀴즈</p>
      </div>
      <button id="logoutBtn" class="btn btn-secondary">로그아웃</button>
    </header>

    <div id="errorBox" class="error-message" style="display: none;"></div>

    <!-- 홈 화면 (방 만들기 & 기록) -->
    <section id="homeSection">
      <div class="glass-panel card">
        <h2>새 게임 만들기</h2>
        <div class="form-row">
          <label for="durationSelect">게임 시간</label>
          <select id="durationSelect" class="input">
            <option value="5">5분</option>
            <option value="10" selected>10분</option>
            <option value="15">15분</option>
            <option value="20">20분</option>
          </select>
          <button id="createRoomBtn" class="btn btn-primary">방 만들기</button>
        </div>
      </div>

      <div class="glass-panel card">
        <div class="card-header">
          <h2>방 기록</h2>
          <button id="deleteAllBtn" class="btn btn-danger">전체 기록 삭제</button>
        </div>
        <div id="roomList" class="room-list"></div>
      </div>
    </section>

    <!-- 대기실 화면 -->
    <section id="lobbySection" style="display: none;">
      <div class="grid-2">
        <div class="glass-panel card center">
          <h2>학생 입장</h2>
          <div id="qrBox" class="qr-box"></div>
          <div id="roomCode" class="room-code">------</div>
          <p class="hint">QR을 찍거나 6자리 코드를 입력하세요.</p>
        </div>

        <div class="glass-panel card">
          <h2>참가자 (<span id="playerCount">0</span>명)</h2>
          <ul id="playerList" class="player-list"></ul>
          <div class="btn-group">
            <button id="startGameBtn" class="btn btn-primary">게임 시작</button>
            <button id="backHomeBtn" class="btn btn-secondary">홈으로</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 게임 진행 중 화면 -->
    <section id="playingSection" style="display: none;">
      <div class="glass-panel card center">
        <h2>게임 진행 중</h2>
        <div id="timerDisplay" class="timer">00:00</div>
        <p id="progressText">학생들이 문제를 풀고 있습니다.</p>
        <button id="endGameBtn" class="btn btn-danger">게임 종료</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="resultSection" style="display: none;">
      <div class="glass-panel card">
        <div class="card-header">
          <h2>게임 결과</h2>
          <button id="resultHomeBtn" class="btn btn-secondary">홈으로</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
